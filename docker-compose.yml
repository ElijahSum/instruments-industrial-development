services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: electricity-backend
    environment:
      DATA_PATH: /data/data.csv
      SEED_DATA_PATH: /app/backend/RU_Electricity_Market_PZ_dayahead_price_volume.csv
    ports:
      - "8888:8888"
    volumes:
      - backend_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/ping', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: electricity-frontend
    environment:
      API_URL: http://backend:8888
      API_TIMEOUT: "15"
    ports:
      - "8889:8889"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8889/_stcore/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  backend_data:
